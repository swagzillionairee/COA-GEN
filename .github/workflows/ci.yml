name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (Python 3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install locked dependencies
        run: python -m pip install --requirement requirements.lock

      - name: Run test suite
        run: python -m pytest -v

      - name: Regenerate examples
        run: python scripts/generate_examples.py

      # Examples and golden renders are committed artifacts. If regenerating them
      # changes anything other than the PDF creation timestamps, the committed
      # copies are stale and need to be refreshed in the same change.
      - name: Check committed renders are current
        id: renders
        run: |
          if ! git diff --quiet -- tests/golden examples; then
            echo "::error::Committed examples or golden renders are out of date."
            git diff --stat -- tests/golden examples
            exit 1
          fi
          echo "Examples and golden renders are current."

      - name: Upload regenerated renders for comparison
        if: failure() && steps.renders.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: regenerated-renders
          path: |
            tests/golden
            examples
          retention-days: 7

  hosted-entry-point:
    name: Hosted entry point health
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install runtime dependencies
        run: python -m pip install --requirement requirements.txt

      - name: Start the hosted entry point and wait for health
        run: |
          python -m streamlit run streamlit_app.py \
            --server.port 8501 --server.headless true &
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8501/_stcore/health | grep -q ok; then
              echo "Hosted entry point reported healthy."
              exit 0
            fi
            sleep 2
          done
          echo "::error::Hosted entry point never became healthy."
          exit 1
